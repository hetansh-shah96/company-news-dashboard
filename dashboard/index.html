<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Company Watch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@20,400,0&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1>Company Watch</h1>
      <div class="topbar-actions">
        <span class="updated" id="lastRefreshed"></span>
        <a
          class="refresh-btn"
          href="https://github.com/hetansh-shah96/company-news-dashboard/actions/workflows/daily-news.yml"
          target="_blank"
          rel="noopener"
          title="Opens the GitHub Actions page — click &quot;Run workflow&quot; there to fetch fresh news now"
        >
          <span class="icon">refresh</span>
          Refresh news
        </a>
      </div>
    </div>
  </header>

  <main>
    <div class="page-intro">
      <h2>Market Overview</h2>
      <p>Daily company news, split from unverified social chatter.</p>
    </div>
    <div id="app">
      <p class="loading">Loading…</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
