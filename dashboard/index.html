<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Watchlist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@20,400,0&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Newsreader:ital,wght@1,500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1><span class="pulse-dot"></span>Watch<em>list</em></h1>
      <div class="topbar-actions">
        <span class="updated" id="lastRefreshed"></span>
        <button id="downloadBtn" class="refresh-btn" type="button">
          <span class="icon">picture_as_pdf</span>
          <span>Download PDF</span>
        </button>
        <button id="manageBtn" class="refresh-btn" type="button">
          <span class="icon">tune</span>
          <span>Manage</span>
        </button>
        <button id="refreshBtn" class="refresh-btn" type="button">
          <span class="icon">refresh</span>
          <span id="refreshBtnLabel">Refresh news</span>
        </button>
      </div>
    </div>
  </header>

  <div id="manageModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3>Manage companies</h3>
        <button id="manageCloseBtn" class="icon-btn" type="button" aria-label="Close">
          <span class="icon">close</span>
        </button>
      </div>
      <form id="addCompanyForm" class="add-company-form">
        <input id="addCompanyName" type="text" placeholder="Company name" maxlength="80" required />
        <input id="addCompanyQuery" type="text" placeholder="Search query (optional)" maxlength="80" />
        <button type="submit" class="refresh-btn">
          <span class="icon">add</span>
          <span>Add</span>
        </button>
      </form>
      <p id="manageError" class="manage-error hidden"></p>
      <ul id="manageList" class="manage-list"></ul>
    </div>
  </div>

  <main>
    <div class="page-intro">
      <h2>Market <em>Overview</em></h2>
      <p>Daily company news, split from unverified social chatter.</p>
    </div>
    <div id="app">
      <p class="loading">Loading…</p>
    </div>
  </main>

  <div id="printReport"></div>

  <button id="chatToggleBtn" class="chat-toggle-btn" type="button" aria-label="Open assistant chat">
    <span class="icon">chat</span>
  </button>
  <div id="chatPanel" class="chat-panel hidden">
    <div class="chat-panel-header">
      <span>Assistant</span>
      <button id="chatCloseBtn" class="icon-btn" type="button" aria-label="Close chat">
        <span class="icon">close</span>
      </button>
    </div>
    <div id="chatMessages" class="chat-messages"></div>
    <form id="chatForm" class="chat-form">
      <input id="chatInput" type="text" placeholder="Ask something…" autocomplete="off" maxlength="4000" />
      <button type="submit" class="icon-btn" aria-label="Send">
        <span class="icon">send</span>
      </button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script type="module">
    import { inject } from 'https://cdn.jsdelivr.net/npm/@vercel/analytics@1/+esm';
    inject();
  </script>
</body>
</html>
