<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Watchlist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@20,400,0&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Newsreader:ital,wght@1,500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1><span class="pulse-dot"></span>Watch<em>list</em></h1>
      <div class="topbar-actions">
        <span class="updated" id="lastRefreshed"></span>
        <button id="downloadBtn" class="refresh-btn" type="button">
          <span class="icon">picture_as_pdf</span>
          <span>Download PDF</span>
        </button>
        <button id="refreshBtn" class="refresh-btn" type="button">
          <span class="icon">refresh</span>
          <span id="refreshBtnLabel">Refresh news</span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <div class="page-intro">
      <h2>Market <em>Overview</em></h2>
      <p>Daily company news, split from unverified social chatter.</p>
    </div>
    <div id="app">
      <p class="loading">Loading…</p>
    </div>
  </main>

  <div id="printReport"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
