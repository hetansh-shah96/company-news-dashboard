name: Watchlist daily fetch

on:
  # No `schedule:` trigger here on purpose: GitHub Actions' own cron scheduler
  # was firing this 10-11+ hours late and drifting later each day (see
  # "Daily trigger" in README). A Vercel Cron Job now calls the
  # `refresh-news` Edge Function on schedule, which dispatches this workflow
  # via `workflow_dispatch` below — same mechanism as the dashboard's
  # "Refresh news" button, just on a timer instead of a click.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-and-summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      - name: Fetch news, summarize, store
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node fetch-news.mjs

      - name: Move backup into repo root data folder
        run: |
          mkdir -p data
          mv scripts/data/*.csv data/ 2>/dev/null || true

      - name: Commit offline backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: daily news backup $(date -u +%F)"
          git push
